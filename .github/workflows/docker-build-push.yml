
name: E-commerce CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-and-push:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # Step 2: Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Step 3: Docker Hub Authentication
      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Step 4: Build and Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6

        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend:${{ github.sha }}

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


      # Step 5: Build and Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6

        with:
          context: ./backend
          file: ./backend/Dockerfile

          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:${{ github.sha }}

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend


      # Step 6: Pipeline completed
      - name: CI/CD Pipeline Status
        run: |
          echo "Frontend image pushed successfully"
          echo "Backend image pushed successfully"
          echo "Docker Hub publishing completed"